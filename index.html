<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Фотофикс">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Фотофиксация заполненных контейнеров: фото с адресом, координатами, датой и временем.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Фотофиксация</title>
<style>
:root{
  --bg:#f3f4f5; --surface:#ffffff; --surface-2:#f3f4f5; --text:#0b1f35; --muted:#5e6a78; --line:#dbdee1;
  --accent:#ef3124; --accent-press:#d4281c; --accent-ink:#ffffff; --accent-soft:#fdebea;
  --ok:#0d9f55; --warn:#d98200; --bad:#ef3124;
  --r:20px; --rb:16px;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e0e0f; --surface:#1c1c1e; --surface-2:#2a2a2e; --text:#ffffff; --muted:#a0a6b0; --line:#34343a;
    --accent:#ef3124; --accent-press:#ff4a3d; --accent-ink:#ffffff; --accent-soft:#3b1715;
    --ok:#3ccb7f; --warn:#ffb341; --bad:#ff5a4e;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);left:0;top:0}
.muted{color:var(--muted)} .sm{font-size:14px} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.warn{color:var(--warn)} .bad{color:var(--bad)}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--bg)}
.hl{min-width:0}
.brand{font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.who{font-size:14px;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.who b{color:var(--text);font-weight:600}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface);border-radius:999px;
  padding:9px 13px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text)}
.iconbtn svg{width:22px;height:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.lv-good .dot{background:var(--ok)} .lv-mid .dot{background:var(--warn)} .lv-poor .dot,.lv-bad .dot{background:var(--bad)}
.lv-search .dot,.lv-wait .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (min-width:760px){ header.top{padding-left:calc(50% - 344px);padding-right:calc(50% - 344px)} }

main{padding:0 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{display:block;background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 12px}
.ttl{font-weight:700;font-size:17px}
.label{display:block;font-size:14px;color:var(--muted);margin:0 0 8px}
input[type=text],textarea{width:100%;font-size:16px;padding:14px 16px;border-radius:var(--rb);border:1.5px solid transparent;background:var(--surface);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--text)}
textarea{resize:vertical;min-height:88px;line-height:1.35}
.field{display:block;margin:0 0 16px}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin:4px 0 4px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.bad{background:transparent;border:1.5px solid var(--bad)}
.banner .bx{flex:1}
.banner b{display:block;font-size:16px;margin-bottom:3px}
.banner .lnk{border:0;background:none;padding:0;margin-top:8px;color:var(--accent);font-weight:700;font-size:15px}
.x{border:0;background:none;font-size:24px;line-height:1;padding:0 2px;color:var(--muted)}

.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0 22px}
.shutter{width:120px;height:120px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  border:8px solid var(--bg);box-shadow:0 0 0 3px var(--accent);transition:transform .08s,background .1s;user-select:none;-webkit-user-select:none}
.shutter:active{transform:scale(.94);background:var(--accent-press)}
.shutter.off{background:var(--line);box-shadow:0 0 0 3px var(--line);color:var(--muted)}
.shutter svg{width:48px;height:48px}
.shutterHint{font-size:16px;color:var(--muted);text-align:center}
.gpsLine{font-size:14px;text-align:center;max-width:460px;color:var(--warn)}
.gpsLine.bad{color:var(--bad)}
.pend{font-size:14px;color:var(--muted);text-align:center;margin:-8px 0 12px}
.pend.bad{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;min-height:56px;border-radius:var(--rb);
  border:0;background:var(--surface);color:var(--text);font-size:16px;font-weight:700;line-height:1.15;padding:6px 16px}
.card .btn,.sheetFoot .btn,.modalCard .btn{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent-press)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;font-size:15px;padding:4px 14px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.col{display:flex;flex-direction:column;gap:8px}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 0;min-width:72px;border:0;background:var(--surface);border-radius:14px;min-height:48px;font-size:16px;font-weight:700;color:var(--text);padding:0 10px}
.seg button.on{background:var(--text);color:var(--surface)}

.day{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.day b{font-size:17px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:560px){ .grid{grid-template-columns:repeat(4,1fr)} }
.shot{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--surface)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .tm{position:absolute;left:6px;bottom:6px;background:rgba(11,31,53,.75);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px}
.shot .st{position:absolute;right:6px;top:6px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;padding:0 5px}
.shot .st.sent{background:var(--ok)}
.shot .st.flag{background:var(--warn);left:6px;right:auto}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--bg);min-height:54px}
.sheetHead b{font-size:17px;font-weight:800;text-align:center}
.link{border:0;background:none;color:var(--accent);font-size:16px;font-weight:700;padding:10px 8px;min-width:96px;text-align:left}
.link.r{text-align:right}
.sheetBody{flex:1;overflow:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.sheetBody>*{max-width:720px;margin-left:auto;margin-right:auto}
.sheetFoot{padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--surface)}
.sheetFoot .btn{width:100%;max-width:720px;display:flex;margin:0 auto}
.sheetFoot .btn.primary{background:var(--accent)}
.preview{position:relative;display:flex;justify-content:center;align-items:center;min-height:200px;background:#000;border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.preview canvas{display:block}
.spinner{position:absolute;width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{background:var(--surface);border-radius:var(--r);padding:6px 16px;margin:0 0 16px}
.fact{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.fact:first-child{border-top:0}
.fact .k{width:86px;flex:none;color:var(--muted)}
.fact .v{flex:1;min-width:0;word-break:break-word}
.fact .v .dot{margin-right:6px;vertical-align:middle;position:relative;top:-1px}
.lockNote{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:-8px 2px 16px}
.vwImg{display:block;width:100%;height:auto;border-radius:var(--r);background:#000;margin-bottom:12px}

#onboard{z-index:25}   /* открывается и поверх настроек */
.obHero{padding:28px 2px 18px}
.obTitle{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
.codeInput{font:700 28px/1 var(--mono)!important;letter-spacing:.06em;text-align:center;padding:18px 12px!important}
.err{color:var(--bad);font-size:15px;margin:10px 2px 0}

.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modalCard{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px}
.mTitle{font-weight:800;font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;background:var(--text);color:var(--surface);
  padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
body.locked #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 60px)}
</style>
</head>
<body>
<header class="top">
  <div class="hl">
    <div class="brand">Фотофиксация</div>
    <div class="who" id="who"></div>
  </div>
  <div class="hr">
    <button class="chip lv-search" id="gpsChip" type="button" aria-label="Состояние GPS"><span class="dot"></span><span id="chipText">GPS…</span></button>
    <button class="iconbtn" id="setBtn" type="button" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>
  <div class="banner" id="banner" hidden>
    <div class="bx"><b id="bnTitle"></b><span id="bnText"></span><br><button class="lnk" id="bnAct" type="button" hidden></button></div>
    <button class="x" id="bnClose" type="button" aria-label="Скрыть">×</button>
  </div>

  <div class="hero">
    <label for="fileInput" class="shutter" id="shutter" role="button" aria-label="Сфотографировать контейнер">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 8.5h3.2l1.8-2.8h7l1.8 2.8h3.2v10.8h-17z"/><circle cx="12" cy="13.6" r="3.6"/></svg>
    </label>
    <div class="shutterHint" id="shutterHint"></div>
    <div class="gpsLine" id="gpsLine" hidden></div>
  </div>
  <div class="pend" id="pending" hidden></div>
  <button class="btn primary wide" id="sendBtn" type="button" hidden></button>
  <div id="shots"></div>
</main>

<input type="file" id="fileInput" accept="image/*" capture="environment" class="vh" tabindex="-1" aria-hidden="true">

<!-- ВХОД ПО КОДУ -->
<div class="sheet" id="onboard" hidden>
  <div class="sheetHead"><span class="link"></span><b></b><button class="link r" id="obClose" type="button">Закрыть</button></div>
  <div class="sheetBody">
    <div class="obHero">
      <div class="obTitle">Вход по коду</div>
      <div class="muted">Введите код подрядчика, который выдал заказчик. Это нужно один раз — дальше приложение помнит вас.</div>
    </div>
    <input id="obCode" class="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="0000-0000-0000" maxlength="14">
    <div class="err" id="obErr" hidden></div>
    <button class="btn primary wide" id="obGo" type="button" style="margin-top:16px">Войти</button>
  </div>
</div>

<!-- НОВЫЙ СНИМОК -->
<div class="sheet" id="review" hidden>
  <div class="sheetHead">
    <button class="link" id="rvCancel" type="button">Отмена</button>
    <b>Снимок <span class="muted" id="rvNum"></span></b>
    <span class="link r"></span>
  </div>
  <div class="sheetBody">
    <div class="preview"><canvas id="rvCanvas" width="0" height="0"></canvas><div class="spinner" id="rvSpin"></div></div>
    <div class="facts">
      <div class="fact"><div class="k">Время</div><div class="v" id="fTime"></div></div>
      <div class="fact"><div class="k">Адрес</div><div class="v" id="fAddr"></div></div>
      <div class="fact"><div class="k">GPS</div><div class="v" id="fGps"></div></div>
    </div>
    <div class="lockNote"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Заполняется автоматически, изменить нельзя</div>
    <div class="field"><span class="label">Размер контейнера</span>
      <div class="seg" id="rvSizes"></div>
      <input id="rvVolOther" type="text" inputmode="decimal" maxlength="5" placeholder="Объём, м³" style="margin-top:8px" hidden></div>
    <label class="field"><span class="label">Комментарий (можно надиктовать)</span>
      <textarea id="rvComment" rows="3" maxlength="1000" autocapitalize="sentences" placeholder="Например: контейнер переполнен, мусор рядом"></textarea></label>
  </div>
  <div class="sheetFoot"><button class="btn primary" id="rvSave" type="button">Сохранить</button></div>
</div>

<!-- ПРОСМОТР СНИМКА -->
<div class="sheet" id="viewer" hidden>
  <div class="sheetHead">
    <button class="link" id="vwClose" type="button">Закрыть</button>
    <b id="vwTitle"></b>
    <span class="link r"></span>
  </div>
  <div class="sheetBody">
    <img id="vwImg" class="vwImg" alt="">
    <div class="facts" id="vwInfo"></div>
  </div>
  <div class="sheetFoot"><button class="btn danger" id="vwDel" type="button">Удалить снимок</button></div>
</div>

<!-- НАСТРОЙКИ -->
<div class="sheet" id="settings" hidden>
  <div class="sheetHead"><span class="link"></span><b>Настройки</b><button class="link r" id="setClose" type="button">Закрыть</button></div>
  <div class="sheetBody">
    <div class="card">
      <div class="label" style="margin-bottom:2px">Подрядчик</div>
      <div class="ttl" id="setWho"></div>
      <button class="btn sm" id="changeWho" type="button" style="margin-top:12px">Сменить код</button>
    </div>
    <div class="card">
      <div class="ttl">Установка на телефон</div>
      <div class="muted sm" id="installText" style="margin-top:4px"></div>
      <button class="btn primary wide" id="installBtn" type="button" style="margin-top:12px" hidden>Установить приложение</button>
    </div>
    <div class="card">
      <div class="ttl">Снимки на телефоне</div>
      <div class="muted sm" id="storeInfo" style="margin:4px 0 12px"></div>
      <div class="col">
        <button class="btn" id="resendAll" type="button">Отправить все снимки заново</button>
        <button class="btn danger" id="clearSent" type="button">Удалить отправленные с телефона</button>
      </div>
    </div>
    <div class="card">
      <div class="ttl">О приложении</div>
      <div class="muted sm" id="about" style="margin-top:4px"></div>
    </div>
  </div>
</div>

<!-- ОТЧЁТ -->
<div class="modal" id="exp" hidden>
  <div class="modalCard">
    <div class="mTitle" id="expTitle"></div>
    <div class="muted" id="expText"></div>
    <div class="bar" id="expBarWrap"><i id="expBar"></i></div>
    <button class="btn primary" id="expSend" type="button" hidden>Отправить</button>
    <button class="btn ghost" id="expClose" type="button">Закрыть</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
const VERSION = '3.1.1';
const BUILD = '20261007-155536';   // deploy.sh подставляет метку сборки; по ней телефон понимает, что вышла новая версия
const PHOTO = { maxSide: 1600, quality: 0.85, stampK: 0.026 };  // размер фиксирован заказчиком
const CLOCK_WARN_MS = 120000;     // расхождение часов телефона с сервером, при котором ставится отметка
const FRESH_MS = 3 * 60000;       // фото старше — не принимается (галерея)
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===================== настройки телефона ===================== */
const DEF = { lastNum: null, hideBanner: false, code: null, contractor: null, cfgHash: null, vol: null };
const S = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('fotofix.s') || '{}')); } catch (e) { return Object.assign({}, DEF); } })();
function saveS() { try { localStorage.setItem('fotofix.s', JSON.stringify(S)); } catch (e) {} }

/* ===================== вход по коду подрядчика ===================== */
const auth = { cfg: null, hash: null, name: null };
const sizes = () => (auth.cfg && Array.isArray(auth.cfg.sizes) && auth.cfg.sizes.length) ? auth.cfg.sizes : [8, 20, 27];
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');
async function sha256hex(text) { return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)))); }
async function loadConfig() {
  try {
    const r = await fetch('config.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    auth.cfg = JSON.parse(txt); auth.hash = await sha256hex(txt);
  } catch (e) { if (!auth.cfg) { auth.cfg = null; auth.hash = null; } }
}
async function unlock(code) {
  const cfg = auth.cfg; if (!cfg || !cfg.kdf) return null;
  try {
    const te = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveBits']);
    const kb = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(cfg.kdf.salt), iterations: cfg.kdf.iter }, base, 256));

// Окна могут лежать друг на друге (отчёт поверх настроек): закрытие кнопкой снимает свою запись истории,
// и этот history.back() не должен закрыть окно под ним — для этого ignorePops.
const sheetStack = [], backHandlers = new Map();
let ignorePops = 0;
function openSheet(el) {
  el.hidden = false; sheetStack.push(el); document.body.classList.add('locked');
  try { history.pushState({ ff: 1 }, ''); } catch (e) {}
}
function closeSheet(el, fromPop) {
  if (el.hidden) return;
  el.hidden = true;
  const i = sheetStack.indexOf(el); if (i >= 0) sheetStack.splice(i, 1);
  if (!sheetStack.length) document.body.classList.remove('locked');
  if (!fromPop) { try { if (history.state && history.state.ff) { ignorePops++; history.back(); } } catch (e) {} }
}
window.addEventListener('popstate', () => {
  if (ignorePops) { ignorePops--; return; }
  const top = sheetStack[sheetStack.length - 1]; if (!top) return;
  const h = backHandlers.get(top); h ? h() : closeSheet(top, true);
});
function thumbUrl(it) { if (!st.thumbs.has(it.id)) st.thumbs.set(it.id, URL.createObjectURL(asBlob(it.thumb))); return st.thumbs.get(it.id); }
function dropItems(ids) {
  const set = new Set(ids);
  st.items = st.items.filter(i => !set.has(i.id));
  ids.forEach(id => { const u = st.thumbs.get(id); if (u) { URL.revokeObjectURL(u); st.thumbs.delete(id); } });
}
// С облаком (config.json → cloud.url) снимки уходят заказчику сами; без него — архивом через «Отправить отчёт».

    const sent = arr.filter(isDone).length;
    html += `<div class="day"><b>${fmtDate(arr[0].t)}</b><span class="muted sm">${snimkov(arr.length)}${sent ? ` · отправлено ${sent}` : ''}</span></div><div class="grid">`;
    arr.forEach(it => {
      html += `<button class="shot" type="button" data-id="${it.id}" aria-label="Снимок № ${it.num}"><img loading="lazy" src="${thumbUrl(it)}" alt="">`
        + `<span class="tm">${fmtTime(it.t).slice(0, 5)}</span>`

/* ===================== новый снимок ===================== */
let R = null, capturing = false, prevTimer = 0;
function openReview(file, tPhone) {
  if (R) discardReview();
  const list = sizes(), other = S.vol != null && !list.includes(S.vol);
  const r = R = { tPhone, t: tPhone, timeSrc: 'pending', offset: null, pos: null, img: null, url: null, closed: false, opened: Date.now(),
    address: undefined, addrFor: null, addrP: null, vol: S.vol != null ? S.vol : list[0], other };
  r.timeP = syncClock().then(ok => {
    if (ok || clockValid()) { r.offset = clock.offset; r.t = r.tPhone + clock.offset; r.timeSrc = 'server'; }
    else { r.timeSrc = 'phone'; r.t = r.tPhone; }
    if (R === r) schedulePreview(0);
  });
  const L = geo.last;
  if (L && Date.now() - L.rx <= 120000) setPos(r, L);
  r.onFix = f => {
    if (r.closed) return;
    if (!r.pos || (Date.now() - r.opened < 30000 && f.acc < r.pos.acc)) { setPos(r, f); schedulePreview(0); }
  };
  fixListeners.add(r.onFix);
  $('#rvComment').value = '';
  $('#rvVolOther').value = other ? String(S.vol).replace('.', ',') : '';
  $('#rvNum').textContent = '№ ' + (S.lastNum + 1);
  renderSizes(); renderReviewFacts();
  const cv = $('#rvCanvas'); cv.width = cv.height = 0; cv.style.width = cv.style.height = '0';
  $('#rvSpin').hidden = false;
  openSheet($('#review'));
  loadImage(file).then(({ img, url }) => {
    if (r.closed) { URL.revokeObjectURL(url); return; }
    r.img = img; r.url = url; drawPreview();
  }).catch(e => { if (!r.closed) { toast(e.message, 4000); discardReview(); } })
    .finally(() => { $('#rvSpin').hidden = true; });
}
function setPos(r, f) {
  r.pos = Object.assign({}, f);
  if (!r.addrFor || distM(r.addrFor.lat, r.addrFor.lon, f.lat, f.lon) > 30) startAddr(r);
  if (R === r) renderReviewFacts();
}
function startAddr(r) {
  const p = r.pos; r.addrFor = p; r.address = undefined;
  r.addrP = geocode(p.lat, p.lon).catch(() => null).then(a => { if (r.addrFor !== p) return; r.address = a; if (R === r) schedulePreview(0); });
}
const stampData = (r, num) => ({ t: r.t, timeSrc: r.timeSrc, pos: r.pos, address: r.address, num, vol: r.vol, contractor: auth.name, comment: ($('#rvComment').value || '').trim() });
function drawPreview() {
  const r = R; if (!r) return;
  renderReviewFacts();
  if (!r.img) return;
  const cv = $('#rvCanvas'), box = $('#review .preview');
  const ar = r.img.naturalWidth / r.img.naturalHeight, cw = box.clientWidth || (window.innerWidth - 32), maxH = window.innerHeight * 0.48;
  let w = cw, h = w / ar; if (h > maxH) { h = maxH; w = h * ar; }
  cv.style.width = Math.round(w) + 'px'; cv.style.height = Math.round(h) + 'px';
  renderPhoto(cv, r.img, Math.round(Math.max(w, h) * Math.min(window.devicePixelRatio || 1, 2.5)), stampData(r, S.lastNum + 1));
}
function schedulePreview(ms = 250) { clearTimeout(prevTimer); prevTimer = setTimeout(drawPreview, ms); }
function factHtml(lv, html) { return `<span class="lv-${lv}"><span class="dot"></span></span>${html}`; }
function renderReviewFacts() {
  const r = R; if (!r) return;
  let t;
  if (r.timeSrc === 'pending') t = factHtml('wait', 'сверяю время с сервером…');
  else if (r.timeSrc === 'server') t = factHtml(Math.abs(r.offset) > CLOCK_WARN_MS ? 'mid' : 'good', `${fmtDate(r.t)} ${fmtTime(r.t)} ${tzLabel(r.t)}`)
    + (Math.abs(r.offset) > CLOCK_WARN_MS ? `<div class="sm warn">часы телефона сбиты на ${fmtDur(Math.abs(r.offset))}</div>` : '');
  else t = factHtml('mid', `${fmtDate(r.t)} ${fmtTime(r.t)} ${tzLabel(r.t)}`) + '<div class="sm warn">по часам телефона — нет сети для сверки</div>';
  $('#fTime').innerHTML = t;

  else a = factHtml('good', esc(r.address));

  if (r.pos) {

    g = factHtml(lv, `<span class="mono">${fmtCoord(r.pos.lat)}, ${fmtCoord(r.pos.lon)}</span> · ±${Math.round(r.pos.acc)} м`) + (lv === 'poor' ? '<div class="sm warn">низкая точность</div>' : '');
  } else if (gpsLevel() === 'bad') g = factHtml('bad', '<span class="bad">нет доступа к геопозиции</span>') + `<div class="sm muted">${esc(denyHelp())}</div>`;
  else g = factHtml('wait', 'ждём GPS… без координат сохранить нельзя');

}
function volValid(r) { return r && r.vol != null && r.vol > 0 && r.vol <= 100; }

function renderSizes() {

  $('#rvSizes').innerHTML = list.map(v => `<button type="button" data-v="${v}" class="${r && !r.other && r.vol === v ? 'on' : ''}">${fmtVol(v)}</button>`).join('')

function discardReview(fromPop) {
  const r = R; if (!r) return;
  r.closed = true; fixListeners.delete(r.onFix);
  if (r.url) URL.revokeObjectURL(r.url);
  R = null; closeSheet($('#review'), fromPop);
}
function queueSave() {
  const r = R;
  if (!r || !r.img) return toast('Фото ещё открывается…');
  if (!r.pos) return toast('Дождитесь GPS — без координат сохранить нельзя');
  if (!volValid(r)) return toast('Укажите размер контейнера');
  if (!auth.name) return toast('Сначала введите код подрядчика');
  const num = ++S.lastNum, comment = ($('#rvComment').value || '').trim(), contractor = auth.name;
  S.vol = r.vol; saveS();
  r.closed = true; fixListeners.delete(r.onFix); R = null;
  closeSheet($('#review'));
  st.pending++; renderPending();
  st.saving = st.saving
    .then(() => doSave(r, num, comment, contractor))
    .catch(e => toast('Снимок № ' + num + ' не сохранился: ' + (e && e.message || e), 7000))
    .finally(() => { URL.revokeObjectURL(r.url); r.img = null; st.pending--; renderPending(); if (!st.pending && cloudUrl()) uploadAll(); });
}
async function doSave(r, num, comment, contractor) {
  await Promise.race([r.timeP, sleep(5000)]);
  if (r.timeSrc === 'pending') { r.timeSrc = 'phone'; r.t = r.tPhone; }
  await Promise.race([r.addrP || Promise.resolve(), sleep(10000)]);
  const d = { t: r.t, timeSrc: r.timeSrc, pos: r.pos, address: r.address || null, num, vol: r.vol, contractor, comment };
  const c = document.createElement('canvas');
  renderPhoto(c, r.img, PHOTO.maxSide, d);
  const W = c.width, H = c.height;
  let bytes = new Uint8Array(await readAB(await canvasToBlob(c, 'image/jpeg', PHOTO.quality)));
  try { bytes = insertExif(bytes, buildExif(d, W, H)); } catch (e) { console.warn('EXIF', e); }
  const crc = crc32(bytes), photo = new Blob([bytes], { type: 'image/jpeg' });
  bytes = null;
  const tc = document.createElement('canvas'), [tw, th] = fitSize(W, H, 320);
  tc.width = tw; tc.height = th;
  const tctx = tc.getContext('2d'); tctx.imageSmoothingQuality = 'high'; tctx.drawImage(c, 0, 0, tw, th);
  const thumb = await canvasToBlob(tc, 'image/jpeg', 0.75);
  c.width = c.height = 0; tc.width = tc.height = 0;
  const p = r.pos;
  const meta = { v: 3, num, t: d.t, tPhone: r.tPhone, timeSrc: d.timeSrc, offset: r.offset, tz: tzName(),
    lat: p.lat, lon: p.lon, acc: p.acc, alt: p.alt, address: d.address, vol: d.vol, contractor, code: S.code, comment,
    w: W, h: H, bytes: photo.size, crc, thumb };
  meta.flags = computeFlags(meta);
  meta.id = await dbAdd(meta, photo);
  st.items.push(meta); st.items.sort((a, b) => b.t - a.t || b.num - a.num);
  up.queued = !!cloudUrl();   // сейчас уйдёт в облако — кнопку «Отправить» не показываем
  refresh();
  toast(`№ ${num} сохранён`);
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  if (!st.persistAsked) { st.persistAsked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }
  if (!d.address) setTimeout(fillAddresses, 15000);
}
// адрес для снимков, сделанных без сети: дописывается в журнал и таблицу (на самом фото остаётся как было)
async function fillAddresses() {
  if (st.filling || navigator.onLine === false) return;
  st.filling = true;
  const changed = [];
  try {
    for (const it of st.items.filter(i => i.lat != null && !i.address && i.v >= 2 && !isDone(i))) {
      const a = await geocode(it.lat, it.lon).catch(() => null);
      if (!a) break;
      it.address = a;
      it.flags = (it.flags || []).filter(f => f !== 'адрес не определён').concat('адрес определён после съёмки (на фото его нет)');
      changed.push(it);
    }
    if (changed.length) await dbPutMetas(changed);
  } finally { st.filling = false; if (changed.length) refresh(); }
}

/* ===================== отправка отчёта ===================== */
async function startSend(items) {
  if (!items.length) return toast('Нет снимков для отправки');
  if (st.pending) await st.saving;
  const job = { cancelled: false, blob: null, name: '', items };
  st.exp = job;
  $('#expTitle').textContent = 'Готовлю отчёт';
  $('#expText').textContent = '';
  $('#expSend').hidden = true; $('#expBarWrap').hidden = false; $('#expBar').style.width = '0%';
  openSheet($('#exp'));
  try {
    job.blob = await buildExport(items, (i, n) => {
      if (job.cancelled) throw new Error('cancel');
      $('#expBar').style.width = Math.round(i / n * 100) + '%';
      $('#expText').textContent = `Фото ${i} из ${n}`;
    });
  } catch (e) {
    if (job.cancelled) return;
    $('#expTitle').textContent = 'Не получилось';
    $('#expText').textContent = (e && e.message) || String(e);
    $('#expBarWrap').hidden = true;
    return;
  }
  if (job.cancelled) return;
  job.name = exportName(items);
  job.file = new File([job.blob], job.name, { type: 'application/zip' });
  job.share = canShareFile(job.file);
  $('#expTitle').textContent = 'Отчёт готов';
  $('#expText').textContent = `${snimkov(items.length)} · ${fmtSize(job.blob.size)}. `
    + (cloudUrl() ? 'Снимки и так уходят заказчику сами — это запасная копия. ' : '')
    + (job.share ? 'Нажмите «Отправить» и выберите мессенджер или почту заказчика.' : 'Архив сохранится в «Загрузки» — отправьте его заказчику в мессенджере или по почте.');
  $('#expSend').textContent = job.share ? 'Отправить' : 'Сохранить архив';
  $('#expBarWrap').hidden = true; $('#expSend').hidden = false;
}
async function sendReady() {
  const job = st.exp; if (!job || !job.blob) return;
  let shared = false;
  if (job.share) {
    try { await navigator.share({ files: [job.file] }); shared = true; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // передумал — ничего не делаем; телефон не дал поделиться — сохраним
  }
  if (!shared) downloadBlob(job.blob, job.name);
  const now = Date.now();
  job.items.forEach(it => { it.sent = now; });
  try { await dbPutMetas(job.items); } catch (e) {}
  closeExport();
  refresh();
  toast(shared ? 'Отчёт отправлен' : 'Архив сохранён в «Загрузки» — отправьте его заказчику из приложения «Файлы»', 6000);
}
function closeExport(fromPop) { if (st.exp) { st.exp.cancelled = true; st.exp = null; } closeSheet($('#exp'), fromPop); }

/* ===================== отправка в облако заказчика ===================== */
// Снимки уходят сами: сразу после сохранения, при появлении сети, при открытии приложения и раз в минуту, если что-то не ушло.
// Функция в Yandex Cloud кладёт фото на Диск заказчика в папку подрядчика и дописывает строку в общую таблицу.
// Тот же снимок сервер узнаёт по содержимому и строку не задваивает — повторять отправку можно смело.
function blobToB64(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
}
async function uploadOne(it) {
  const jpg = await blobToB64(await dbGetImg(it.id)), m = {};
  ['num', 't', 'tPhone', 'timeSrc', 'offset', 'lat', 'lon', 'acc', 'alt', 'address', 'vol', 'comment', 'flags'].forEach(k => { m[k] = it[k]; });
  let r, j = null;
  try { r = await fetchTimeout(cloudUrl(), 120000, { method: 'POST', body: JSON.stringify({ a: 'up', code: it.code || S.code, m, jpg }) }); }
  catch (e) { throw new Error(navigator.onLine === false ? 'нет интернета' : 'нет связи с облаком'); }
  try { j = await r.json(); } catch (e) {}
  if (j && j.ok) return j;
  const busy = r.status === 429 || (j && j.error === 'busy');   // облако занято (лимит одновременных запросов)
  const e = new Error(busy ? 'облако занято' : (j && j.message) || `облако ответило ошибкой ${r.status}`);
  e.code = busy ? 'busy' : j && j.error;
  throw e;
}
async function uploadAll(manual) {
  up.queued = false;
  if (up.busy || st.pending || !cloudUrl() || !S.code || !auth.name) return renderMain();
  if (navigator.onLine === false) {
    up.err = 'нет интернета'; refresh();
    if (manual) toast('Нет интернета — снимки уйдут сами, когда появится сеть', 5000);
    return;
  }
  up.busy = true; up.err = null; up.done = up.total = 0; refresh();
  let sent = 0;
  try {
    if (unsent().some(i => !i.address && i.lat != null)) await fillAddresses().catch(() => {});
    const list = unsent().sort((a, b) => a.t - b.t || a.num - b.num);
    up.total = list.length; renderPending();
    for (const it of list) {
      if (!st.items.includes(it)) continue;      // удалили, пока шла отправка
      try {
        const j = await uploadOne(it);
        it.up = Date.now(); it.upN = j.n; delete it.upErr;
        sent++;
      } catch (e) {
        // снимок повреждён или снят под прежним, уже отключённым кодом — помечаем и идём дальше; остальное — повторим позже
        if (e.code === 'bad' || (e.code === 'code' && it.code && it.code !== S.code)) it.upErr = e.message;
        else throw e;
      }
      await dbPutMetas([it]);
      up.done++; renderShots(); renderPending();
    }
    up.retryAt = 0;
  } catch (e) {
    up.err = (e && e.message) || String(e);
    up.retryAt = Date.now() + (e && e.code === 'busy' ? 15000 + Math.random() * 15000 : 60000);
    if (manual) toast('Не отправилось: ' + up.err + '. Отправлю сам позже.', 6000);
  } finally {
    up.busy = false; refresh();
  }
  if (sent && (manual || sent > 1)) toast(`Отправлено заказчику: ${snimkov(sent)}`, 3500);
}

/* ===================== настройки ===================== */
async function renderSettings() {
  $('#setWho').textContent = auth.name || 'не выбран';
  $('#changeWho').textContent = auth.name ? 'Сменить код' : 'Ввести код';
  const total = st.items.reduce((s, i) => s + fileBytes(i), 0), sent = st.items.filter(isDone).length;
  $('#resendAll').hidden = !st.items.length;
  $('#resendAll').textContent = cloudUrl() ? 'Сохранить архив всех снимков' : 'Отправить все снимки заново';
  $('#clearSent').hidden = !sent;
  $('#about').textContent = `Версия ${VERSION}, сборка ${BUILD}. Приложение обновляется само — переустанавливать не нужно, снимки сохраняются. `
    + 'Не удаляйте его с экрана: на iPhone вместе с иконкой удаляются снимки. '
    + `Дата и время сверяются с сервером и пишутся по ${tzName() === 'Europe/Moscow' ? 'московскому времени' : tzName()}, адрес — по GPS; изменить их нельзя. `
    + (cloudUrl() ? 'Снимки сами уходят заказчику в облако.' : 'Таблица в отчёте защищена от правки.');
  renderInstall();
  let txt = `${snimkov(st.items.length)} · ${fmtSize(total)}` + (st.items.length ? ` · отправлено ${sent}` : '');
  try { if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) txt += ' · защищено от автоочистки'; } catch (e) {}
  $('#storeInfo').textContent = txt;
}
function renderInstall() {
  const t = $('#installText'), b = $('#installBtn');
  b.hidden = true;
  if (!window.isSecureContext) t.textContent = 'Сейчас приложение открыто как файл — установка и GPS недоступны. Откройте его по https-ссылке.';
  else if (isStandalone()) t.textContent = 'Установлено ✓ Запускайте с иконки — работает без интернета.';
  else if (isIOS) t.textContent = 'Откройте эту страницу в Safari → кнопка «Поделиться» (квадрат со стрелкой) → «На экран „Домой“». Дальше запускайте с иконки.';
  else if (st.bip) { t.textContent = 'Приложение появится на главном экране и будет работать без интернета.'; b.hidden = false; }
  else t.textContent = 'В Chrome: меню ⋮ → «Установить приложение» (или «Добавить на главный экран»). Дальше запускайте с иконки.';
}
async function doInstall() {
  const e = st.bip; if (!e) return;
  e.prompt();
  try { await e.userChoice; } catch (_) {}
  st.bip = null; renderInstall(); renderBanner();
}
function openSettings() { renderSettings(); openSheet($('#settings')); }

/* ===================== события ===================== */
function bind() {
  $('#gpsChip').addEventListener('click', () => { if (gpsLevel() !== 'good' && gpsLevel() !== 'mid') toast($('#gpsLine').textContent || denyHelp(), 7000); });
  $('#setBtn').addEventListener('click', openSettings);
  $('#setClose').addEventListener('click', () => closeSheet($('#settings')));
  $('#bnClose').addEventListener('click', () => { S.hideBanner = true; saveS(); renderBanner(); });
  $('#bnAct').addEventListener('click', () => st.bip ? doInstall() : openSettings());

  // вход
  $('#changeWho').addEventListener('click', openOnboard);   // поверх настроек; после входа вернёмся в них
  $('#obClose').addEventListener('click', () => closeSheet($('#onboard')));
  $('#obGo').addEventListener('click', tryCode);
  $('#obCode').addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 12);
    e.target.value = d.replace(/(\d{4})(?=\d)/g, '$1-');
  });
  $('#obCode').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });

  // съёмка
  $('#shutter').addEventListener('click', e => {
    if (!auth.name) { e.preventDefault(); openOnboard(); return; }
    capturing = true;
  });
  $('#fileInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = ''; capturing = false;
    if (!f) return;
    const now = Date.now(), lm = f.lastModified;
    if (lm && now - lm > FRESH_MS) { toast('Принимаются только фото, снятые сейчас камерой приложения.', 5000); return; }
    openReview(f, lm && lm <= now + 60000 ? Math.min(lm, now) : now);
  });
  $('#rvComment').addEventListener('input', () => schedulePreview());
  $('#rvSizes').addEventListener('click', e => {
    const b = e.target.closest('button'), r = R; if (!b || !r) return;
    if (b.dataset.v === 'other') {
      r.other = true;
      const v = parseFloat($('#rvVolOther').value.replace(',', '.'));
      r.vol = isFinite(v) ? v : null;
      renderSizes(); $('#rvVolOther').focus();
    } else { r.other = false; r.vol = +b.dataset.v; renderSizes(); }
    updateSaveBtn(); schedulePreview(0);
  });
  $('#rvVolOther').addEventListener('input', e => {
    const r = R; if (!r) return;
    e.target.value = e.target.value.replace(/[^\d.,]/g, '');
    const v = parseFloat(e.target.value.replace(',', '.'));
    r.vol = isFinite(v) ? Math.round(v * 10) / 10 : null;
    updateSaveBtn(); schedulePreview();
  });
  $('#rvSave').addEventListener('click', queueSave);
  $('#rvCancel').addEventListener('click', () => { if (confirm('Удалить этот снимок без сохранения?')) discardReview(); });
  backHandlers.set($('#review'), () => {
    if (confirm('Снимок не сохранён. Выйти без сохранения?')) discardReview(true);
    else { try { history.pushState({ ff: 1 }, ''); } catch (e) {} }
  });
  window.addEventListener('resize', () => { if (R) schedulePreview(150); });

  // снимки и отчёт
  $('#shots').addEventListener('click', e => { const s = e.target.closest('.shot'); if (s) openViewer(+s.dataset.id); });
  $('#sendBtn').addEventListener('click', () => cloudUrl() ? uploadAll(true) : startSend(unsent()));
  $('#expSend').addEventListener('click', sendReady);
  $('#expClose').addEventListener('click', () => closeExport());
  backHandlers.set($('#exp'), () => closeExport(true));
  $('#exp').addEventListener('click', e => { if (e.target.id === 'exp') closeExport(); });
  $('#vwClose').addEventListener('click', () => closeViewer());
  backHandlers.set($('#viewer'), () => closeViewer(true));
  $('#vwDel').addEventListener('click', async () => {
    const v = st.view; if (!v || !confirm(`Удалить снимок № ${v.it.num} с телефона?`)) return;
    try { await dbDel([v.it.id]); dropItems([v.it.id]); closeViewer(); refresh(); toast('Удалено'); }
    catch (e) { toast('Не удалось удалить: ' + e.message, 4000); }
  });

  // настройки
  $('#resendAll').addEventListener('click', () => startSend(st.items));
  $('#clearSent').addEventListener('click', async () => {
    const ids = st.items.filter(isDone).map(i => i.id); if (!ids.length) return;
    if (!confirm(`Удалить с телефона ${snimkov(ids.length)}, которые уже отправлены?`)) return;
    try { await dbDel(ids); dropItems(ids); refresh(); toast('Удалено: ' + snimkov(ids.length)); }
    catch (e) { toast('Не удалось удалить: ' + e.message, 4000); }
  });
  $('#installBtn').addEventListener('click', doInstall);

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); st.bip = e; renderInstall(); renderBanner(); });
  window.addEventListener('appinstalled', () => { st.bip = null; renderInstall(); renderBanner(); });
  window.addEventListener('online', () => { syncClock(); cloudUrl() ? uploadAll() : fillAddresses(); });
  window.addEventListener('offline', () => renderMain());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { capturing = false; if (auth.name) geoStart(); renderGps(); checkUpdate(); if (unsent().length) uploadAll(); }
    else if (!capturing) geoStop();
  });
  window.addEventListener('beforeunload', e => { if (st.pending) { e.preventDefault(); e.returnValue = ''; } });
}

/* ===================== обновления без переустановки ===================== */
// Каждая публикация меняет метку сборки в sw.js → браузер сам скачивает новую версию в фоне.
// Как только она готова, приложение перезапускается в «тихий» момент: не во время съёмки, сохранения или отправки.
// Снимки (IndexedDB) обновлением не затрагиваются.
const upd = { reg: null, need: false, changes: 0 };
function safeToReload() { return document.visibilityState === 'visible' && !capturing && !R && !st.pending && !sheetStack.length && !st.exp && !up.busy; }
function maybeReload() {
  if (!upd.need || !safeToReload()) return;
  upd.need = false;
  try { sessionStorage.setItem('fotofix.updated', '1'); } catch (e) {}
  location.reload();
}
function setupSW() {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had || ++upd.changes > 1) { upd.need = true; maybeReload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => { upd.reg = reg; }).catch(() => {});
}
function checkUpdate() { if (upd.reg) upd.reg.update().catch(() => {}); }

async function init() {
  bind();
  await initAuth();
  try { st.items = (await dbAll()).sort((a, b) => b.t - a.t || b.num - a.num); }
  catch (e) { toast('Хранилище недоступно: ' + (e && e.message || e), 8000); }
  if (S.lastNum == null) { S.lastNum = st.items.reduce((m, i) => Math.max(m, i.num || 0), 0); saveS(); }
  if (auth.name) geoStart();
  renderMain();
  if (!auth.name && window.isSecureContext) openOnboard();
  setInterval(() => { if (document.visibilityState === 'visible') renderGps(); if (upd.need) maybeReload(); }, 1000);
  setInterval(checkUpdate, 30 * 60000);
  setInterval(() => { if (cloudUrl() && !up.busy && document.visibilityState === 'visible' && Date.now() >= up.retryAt && unsent().length) uploadAll(); }, 15000);
  syncClock(); cloudUrl() ? uploadAll() : fillAddresses();
  setupSW();
  try { if (sessionStorage.getItem('fotofix.updated')) { sessionStorage.removeItem('fotofix.updated'); toast(`Приложение обновлено до версии ${VERSION}`, 4000); } } catch (e) {}
}
init();
</script>
